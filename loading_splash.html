<!--
=====================================================================================
  HOW TO USE THIS FILE  (read this before deploying)
=====================================================================================
  1. Edit the BACKEND_URL constant inside the <script> below - set it to your real
     Render web service URL, e.g. "https://srj-whatsapp-bot.onrender.com"
     (no trailing slash).

  2. Deploy *this single file* as its own small, ALWAYS-ON static site - NOT on the
     same Render "Web Service" as your Flask app (that one sleeps on the free plan).
     Easiest free options that never sleep:
        - Render "Static Site" (a *different* service type than your Web Service -
          Static Sites are served from a CDN and do not spin down)
        - GitHub Pages
        - Cloudflare Pages
        - Netlify / Vercel (static)

  3. Point your QR code and any shared links to THIS page's URL instead of your
     Render web service's URL directly.

  What it does: shows a branded loading screen the instant it opens (because it's on
  an always-fast static host), with a timer that simply counts the REAL elapsed
  seconds - it does not guess or assume a fixed wake-up time, it just keeps ticking
  for exactly as long as the wake-up actually takes. In the background it quietly
  pings your Flask app's /static/logo.png every 2 seconds. The moment that succeeds
  (meaning Render has finished waking the service up), it redirects the visitor
  straight into the real site - they never see Render's own cold-start page.
=====================================================================================
-->
<style>
:root{--blue:#2e3f96;--blue2:#172574;--navy:#0d1650;--orange:#f15307;--orange2:#ff8a3d;--mute:#cfd4f5}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
 font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;overflow:hidden;
 background:radial-gradient(circle at 50% 35%,#1b2a80,var(--navy) 72%)}

/* drifting ambience, same family as the /auth page so the hand-off feels seamless */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
.o1{width:460px;height:460px;left:-140px;top:-120px;background:radial-gradient(circle,#f15307 0,#f1530700 70%);animation:fl1 18s ease-in-out infinite}
.o2{width:520px;height:520px;right:-180px;bottom:-200px;background:radial-gradient(circle,#4f63d6 0,#4f63d600 70%);animation:fl2 24s ease-in-out infinite}
@keyframes fl1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,50px)}}
@keyframes fl2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-40px)}}

.card{position:relative;z-index:1;text-align:center;padding:34px 30px;max-width:380px;width:100%}

.brand{display:flex;align-items:center;justify-content:center;margin-bottom:30px}
.brand img{max-width:100%;height:auto;max-height:64px;background:#fff;border-radius:10px;padding:8px 14px;box-shadow:0 6px 18px #00000040}

/* reverse countdown ring - drains from full to empty as the count goes down to 0 */
.ring{position:relative;width:108px;height:108px;margin:0 auto 20px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .track{stroke:#ffffff1f}
.ring .bar{stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}

h1{font-size:18px;margin:0 0 6px;font-weight:800}
p.msg{min-height:20px;font-size:13.5px;color:var(--mute);margin:0 0 4px;transition:opacity .3s}
p.msg.fade{opacity:0}
p.sub{font-size:11.5px;color:#9aa0cc;margin:0 0 20px}

.dots{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
.dots i{width:6px;height:6px;border-radius:50%;background:#ffffff35;animation:dot 1.3s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}

.hint{font-size:11.5px;color:#9aa0cc;line-height:1.5}
.hint a{color:var(--orange2);text-decoration:none;font-weight:700}

@media(prefers-reduced-motion:reduce){.orb,.dots i{animation:none}.ring .bar{transition:none}}
</style></head>

 <h1>Opening your chat…</h1>
 <p class="msg" id="msg">Connecting to our server</p>
 <p class="sub">Screen opens automatically when the count reaches 0</p>
 <div class="dots"><i></i><i></i><i></i></div>

 <div class="hint">Taking a little longer than usual? <a href="#" id="manualOpen">Open anyway →</a></div>
</div>

<script>
(function(){
  // 1. ----- EDIT THIS to your real Render web-service URL (no trailing slash) -----
  var BACKEND_URL = "https://your-app-name.onrender.com";
  // ----------------------------------------------------------------------------

  var PING_PATH   = "/static/logo.png";  // a small static file your Flask app already serves
  var PING_EVERY  = 2000;                // ms between wake-up checks
  var DEFAULT_WAKE = 30;                 // first-ever-visit fallback only, in seconds - replaced by the real measured time below
  var STORAGE_KEY  = "srjWakeSeconds";   // remembers the REAL measured wake time on this device, so the countdown is no longer a guess

  // ---- self-calibrating countdown: use the actual wake time measured on this
  //      device's last visit (if any), instead of a fixed guessed number ----
  var storedWake = null;
  try { storedWake = parseInt(localStorage.getItem(STORAGE_KEY), 10); } catch (e) {}
  var COUNTDOWN = (storedWake && storedWake > 0 && storedWake < 300) ? storedWake : DEFAULT_WAKE;

  var pageStart = Date.now();   // used to measure the REAL time this wake-up actually took
  var clockEl = document.getElementById('clock'), msgEl = document.getElementById('msg'), bar = document.getElementById('bar');
  var CIRC = 2 * Math.PI * 46;
  bar.style.strokeDasharray = CIRC; bar.style.strokeDashoffset = 0;

  var messages = [
    "Connecting to our server",
    "Waking up the chat service",
    "Almost there, hang tight",
    "Steel servers warming up",
    "Just a few more seconds"
  ];
  var mi = 0;
  setInterval(function(){
    mi = (mi + 1) % messages.length;
    msgEl.classList.add('fade');
    setTimeout(function(){ msgEl.textContent = messages[mi]; msgEl.classList.remove('fade'); }, 300);
  }, 3400);

  var redirected = false;

  function goIn(){
    if (redirected) return;
    redirected = true;
    clockEl.textContent = "0";
    bar.style.strokeDashoffset = CIRC;
    msgEl.textContent = "Ready! Opening now…";
    // remember exactly how long THIS wake-up really took, so next time the
    // countdown starts from the real number instead of the first-visit guess
    var actualSeconds = Math.max(1, Math.ceil((Date.now() - pageStart) / 1000));
    try { localStorage.setItem(STORAGE_KEY, String(actualSeconds)); } catch (e) {}
    location.href = BACKEND_URL + "/";
  }

  // ---- reverse countdown: ticks DOWN to 0, and the moment it hits 0 the screen
  //      opens. If the backend is still not actually ready by then (a slower-than-
  //      usual wake-up), it quietly starts the count again from COUNTDOWN instead
  //      of opening a broken/sleeping page - so it only ever opens once the backend
  //      has truly answered. ----
  var n = COUNTDOWN;
  function countdownTick(){
    if (redirected) return;
    clockEl.textContent = n;
    bar.style.strokeDashoffset = CIRC * (1 - n / COUNTDOWN);
    if (n <= 0){
      // Count reached 0. In the normal case the background ping (below) has
      // already confirmed the backend is awake and called goIn() well before
      // this point, so this line is never reached. It only runs if the wake-up
      // is slower than COUNTDOWN seconds - then it quietly starts the ring
      // again from the top instead of opening a page that's still asleep.
      n = COUNTDOWN;
    } else {
      n--;
    }
    setTimeout(countdownTick, 1000);
  }
  countdownTick();

  function ping(){
    if (redirected) return;
    var img = new Image();
    img.onload = goIn;                                         // backend answered with a real image -> it's awake, open right away
    img.onerror = function(){ setTimeout(ping, PING_EVERY); };  // still sleeping / cold-start page -> retry
    img.src = BACKEND_URL + PING_PATH + "?_=" + Date.now();     // cache-bust so we don't get a stale cached result
  }
  ping();

  document.getElementById('manualOpen').addEventListener('click', function(ev){
    ev.preventDefault(); goIn();
  });
})();
</script>
