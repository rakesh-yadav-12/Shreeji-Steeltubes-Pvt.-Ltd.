{% extends "base.html" %}{% block body %}
<div class="card"><h3>Upload catalog / technical file</h3><form method="post" enctype="multipart/form-data" class="row">
<select name="category"><option value="catalogue">Company Catalogue</option><option value="datasheet">Technical Datasheet / Size-Thk / Weight chart</option><option value="certificate">Distribution Certificate</option><option value="awards">Awards & Achievements</option><option value="documents">📄 Documents (shown under Documents in chat)</option></select>
<input name="title" placeholder="Title" required><input type="file" name="file" required><button>Upload</button></form></div>
<div class="card"><table><tr><th>Category</th><th>Title</th><th>File</th><th></th></tr>
{% for d in docs %}<tr><td>{{d.category}}</td><td>{{d.title}}</td><td><a href="/files/{{d.filename}}">{{d.filename}}</a></td><td><form method="post" action="/admin/documents/{{d.id}}/delete"><button class="s">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
