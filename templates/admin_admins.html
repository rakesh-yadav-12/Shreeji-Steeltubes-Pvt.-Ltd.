{% extends "base.html" %}{% block body %}
<div class="card"><h3>Add admin</h3><form method="post" class="row"><input name="name" placeholder="Name" required><input name="phone" placeholder="Contact number" required><input name="password" type="password" placeholder="Password" required><button>Add admin</button></form></div>
<div class="card"><h3>Admins (stored in MongoDB)</h3><table><tr><th>Name</th><th>Contact</th><th>Status</th><th></th></tr>
{% for a in admins %}<tr><td>{{a.name}}</td><td>{{a.phone}}</td><td>{{'Active' if a.active else 'Disabled'}}</td><td>{% if a.id!=me %}<form method="post" action="/admin/admins/{{a.id}}/toggle"><button class="s">{{'Disable' if a.active else 'Enable'}}</button></form>{% else %}(you){% endif %}</td></tr>{% endfor %}</table></div>
<div class="card"><h3>Change my password</h3><form method="post" class="row"><input type="hidden" name="action" value="password"><input name="password" type="password" required><button>Update</button></form></div>{% endblock %}
