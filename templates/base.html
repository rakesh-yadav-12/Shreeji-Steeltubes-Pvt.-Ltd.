<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shreeji SteelTubes</title><link rel="icon" href="/static/logo.png">
<style>
:root{--blue:#2E3F96;--orange:#EE6A24}
*{box-sizing:border-box}body{font-family:system-ui,Arial;margin:0;background:#f4f6fb;color:#222}
nav{background:#fff;border-bottom:3px solid var(--orange);padding:8px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
nav img{height:38px;margin-right:auto}nav a{color:var(--blue);text-decoration:none;font-size:14px;font-weight:600}
nav a:hover{color:var(--orange)}
main{max-width:1100px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0002;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px;border-bottom:1px solid #eee;vertical-align:top}
th{background:#eef1fb;color:var(--blue)}
input,select,button,.btn{padding:8px 10px;margin:3px 0;font-size:14px;border-radius:5px}input,select{border:1px solid #ccd}
button,.btn{background:var(--blue);color:#fff;border:0;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:var(--orange)}.btn.s{padding:4px 8px;font-size:12px}
.msg{background:#fff3cd;padding:10px;border-radius:6px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
img{max-width:100%;height:auto}h3,h4{margin:.2em 0 .6em}
nav{position:sticky;top:0;z-index:50}.lg{margin-right:auto;display:flex}.nl{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.nb{display:none;background:var(--blue);font-size:22px;padding:4px 12px;line-height:1.2}
.cform{border:1px solid #e3e7f5;border-radius:10px;padding:12px;margin-bottom:12px;background:#fafbff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 10px;margin-bottom:6px}
.cgrid label{display:block;font-size:12px;font-weight:600;color:var(--blue)}.cgrid input{display:block;width:100%;margin:3px 0 0;font-weight:400;color:#222}
.row>input,.row>select{flex:1 1 170px;min-width:0}
@media(max-width:760px){
 nav{padding:8px 12px}.nb{display:block}.nl{display:none;width:100%;flex-direction:column;align-items:stretch;gap:0;order:3}
 nav.open .nl{display:flex}.nl a{padding:12px 4px;border-top:1px solid #eef0f8;font-size:15px}
 main{margin:12px auto;padding:0 10px}.card{padding:12px}
 .row>*{flex:1 1 100%}.row .btn,.row button{text-align:center}
 .cgrid{grid-template-columns:1fr}.cform button{width:100%}
 th,td{padding:6px 5px}input,select,button,.btn{font-size:16px}
}
@media print{nav,.noprint{display:none}}
</style></head><body>
<nav><a href="/" class="lg"><img src="/static/logo.png" alt="Shreeji SteelTubes"></a>
<button class="nb" type="button" aria-label="Menu" onclick="this.parentNode.classList.toggle('open')">☰</button><div class="nl">
{% if session.admin_id %}<a href="/">Home</a><a href="/admin/enquiries">Enquiries</a><a href="/admin/customers">Customers</a><a href="/admin/jobs">Jobs</a><a href="/admin/vendors">Vendors</a><a href="/admin/contacts">Contacts</a><a href="/admin/documents">Catalog files</a><a href="/admin/qr">QR code</a><a href="/admin/admins">Admins</a><a href="/admin/logout">Logout ({{session.admin_name}})</a>
{% else %}<a href="/admin/login">🔐 Admin Login</a>{% endif %}</div></nav>
<main>{% for m in get_flashed_messages() %}<div class="msg">{{m}}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
